name: Temporary Prisma migration check

# Temporary, manual-only workflow for applying the single reviewed Neon migration
# from Linux. Remove after the migration has been verified and applied.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prisma-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migration status and guard deploy
        shell: bash
        run: |
          set -o pipefail
          status_file="$(mktemp)"
          set +e
          npx prisma migrate status --schema=prisma/schema.prisma 2>&1 | tee "$status_file"
          status_code=${PIPESTATUS[0]}
          set -e

          if grep -Eiq 'P100[0-9]|drift detected|reset|failed migration|migration(s)? have failed|modified since|edited migration|schema drift' "$status_file"; then
            echo "Migration guard failed: Prisma reported a failed/edited migration, drift, reset requirement, or database error."
            rm -f "$status_file"
            exit 1
          fi

          # Prisma may return exit code 1 when migrations are pending. The
          # database-backed guard below is authoritative for the exact list.
          if [ "$status_code" -gt 1 ]; then
            echo "Migration guard failed: unexpected prisma migrate status exit code $status_code."
            rm -f "$status_file"
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const { PrismaClient } = require("@prisma/client");

          const expected = "20260911090000_written_venue_candidate_allocations";
          const migrationRoot = "prisma/migrations";
          const localNames = new Set(
            fs.readdirSync(migrationRoot, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name),
          );

          const prisma = new PrismaClient();
          (async () => {
            const rows = await prisma.$queryRawUnsafe(
              'SELECT "migration_name", "finished_at", "rolled_back_at" FROM "_prisma_migrations" ORDER BY "started_at"',
            );
            if (!rows.length) throw new Error("Migration history is missing.");

            const failed = rows.filter((row) => !row.finished_at || row.rolled_back_at);
            if (failed.length) throw new Error("Migration history contains a failed or rolled-back migration.");

            const applied = new Set(
              rows.filter((row) => row.finished_at && !row.rolled_back_at).map((row) => row.migration_name),
            );
            const unknown = [...applied].filter((name) => !localNames.has(name));
            if (unknown.length) throw new Error("Migration history contains a migration absent from the repository.");

            const pending = [...localNames].filter((name) => !applied.has(name)).sort();
            if (pending.length !== 1 || pending[0] !== expected) {
              throw new Error(`Expected exactly one pending migration (${expected}); found ${pending.join(", ") || "none"}.`);
            }

            console.log(`Migration guard passed: exactly one pending migration (${expected}).`);
          })()
            .catch((error) => {
              console.error(error.message);
              process.exitCode = 1;
            })
            .finally(() => prisma.$disconnect());
          NODE
          rm -f "$status_file"

      - name: Apply the single pending migration
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify database schema is up to date
        shell: bash
        run: |
          final_status="$(mktemp)"
          if ! npx prisma migrate status --schema=prisma/schema.prisma >"$final_status" 2>&1; then
            echo "Final migration status failed."
            rm -f "$final_status"
            exit 1
          fi
          if ! grep -Eiq 'Database schema is up to date' "$final_status"; then
            echo "Final migration status did not confirm an up-to-date database."
            rm -f "$final_status"
            exit 1
          fi
          rm -f "$final_status"
          echo "Database schema is up to date."
